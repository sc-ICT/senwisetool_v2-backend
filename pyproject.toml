[tool.poetry]
name = "senwisetool-backend"
version = "0.1.0"
description = "SenWiseTool — API de gestionnaire intélligent d'enquêtes et collecte de données"
authors = ["Senwisetool <you@example.com>", "JLove <jlove@example.com>"] 
package-mode = false
packages = [{include = "app"}]

[tool.poetry.dependencies] 
python = "^3.13"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0.36" }
asyncpg = "^0.30.0"
alembic = "^1.14.0"
pydantic = { extras = ["email"], version = "^2.10.0" }
pydantic-settings = "^2.7.0"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
python-multipart = "^0.0.20"
aiofiles = "^24.1.0"
fastapi-mail = "^1.4.2"
click = ">=8.4.2,<9.0.0" 
bcrypt = "^5.0.0"
psycopg2 = "^2.9.12"
openpyxl = "^3.1.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.28.0"
black = "^24.10.0"
ruff = "^0.8.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.poetry.scripts]
cli = "cli:cli"
